asyncapi: '3.0.0'
info:
  title: terraOS MQTT Contract
  version: '0.3.0'
  description: |
    Contrato del bus MQTT de terraOS (ADR-0003). Todo mensaje que cruza el bus
    MUST cumplir este spec. Ningún PR cambia un mensaje sin actualizar este
    archivo en el mismo commit.
    Convenciones:
    - Todos los topics llevan {tenant} (ADR-0007).
    - Telemetría: QoS 1. Comandos a actuadores: QoS 1 + confirmación de estado obligatoria.
    - Timestamps ISO 8601 UTC. Unidades SI (salvo EC en mS/cm y pH adimensional).
    - El simulador (ESPHome modo host) y el hardware real publican por el mismo contrato.
    - v0.2.0: +device/status (retained + LWT), +solicitudes humanas (ADR-0009),
      métricas de hidroponía (EC, pH, temperatura de agua), acción dose.
    - v0.3.0: +canal confidence por módulo (ADR-0010), eventos task_created/task_done.

servers:
  mosquitto:
    host: mqtt:1883
    protocol: mqtt
    description: Broker único del sistema (Mosquitto). En producción vive en el VPS; en el edge hay broker local con bridge (ADR-0006).

channels:
  telemetry:
    address: terraos/{tenant}/{parcela}/sensor/{device}/{metric}
    description: |
      Lectura de un sensor. {metric}: ec | ph | water_temp | air_temp |
      air_humidity | tank_level | flow | battery | rssi
      (Hidroponía: EC, pH y temperatura de agua son esenciales; no hay suelo.)
    parameters:
      tenant: { description: ID de finca (multi-tenant por diseño, ADR-0007) }
      parcela: { description: ID de parcela/módulo }
      device: { description: ID del dispositivo }
      metric: { description: Métrica reportada }
    messages:
      reading:
        $ref: '#/components/messages/SensorReading'

  deviceStatus:
    address: terraos/{tenant}/{parcela}/device/{id}/status
    description: |
      Estado de vida del dispositivo. Mensaje RETAINED: el broker guarda el
      último estado. Cada dispositivo registra un LWT (Last Will): si muere
      sin despedirse, el broker publica offline automáticamente.
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      id: { description: ID del dispositivo }
    messages:
      status:
        $ref: '#/components/messages/DeviceStatus'

  moduleConfidence:
    address: terraos/{tenant}/{parcela}/confidence
    description: |
      Termómetro de confianza del módulo (ADR-0010): qué tan bien conoce el
      sistema el estado real. Mensaje RETAINED. Lo publica el servicio de
      dominio (cálculo determinístico fuente × edad; jamás el LLM).
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
    messages:
      confidence:
        $ref: '#/components/messages/ModuleConfidence'

  actuatorCommand:
    address: terraos/{tenant}/{parcela}/actuator/{device}/cmd
    description: |
      Comando a actuador. SOLO el policy module publica aquí (ADR-0002).
      Ni el cerebro ni la UI tienen acceso de escritura a estos topics.
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      device: { description: ID del actuador }
    messages:
      command:
        $ref: '#/components/messages/ActuatorCommand'

  actuatorState:
    address: terraos/{tenant}/{parcela}/actuator/{device}/state
    description: Confirmación de estado del actuador tras ejecutar (o rechazar) un comando.
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      device: { description: ID del actuador }
    messages:
      state:
        $ref: '#/components/messages/ActuatorState'

  humanRequest:
    address: terraos/{tenant}/{parcela}/request/{device}
    description: |
      Solicitud de acción de un humano (botón en Home Assistant, ADR-0009).
      NO es un comando: el policy module la valida como cualquier propuesta
      del agente y solo él emite el ActuatorCommand resultante.
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      device: { description: ID del actuador solicitado }
    messages:
      request:
        $ref: '#/components/messages/HumanRequest'

  cameraCapture:
    address: terraos/{tenant}/{parcela}/camera/{device}/capture
    description: |
      Anuncio de captura de cámara. El binario va a MinIO; aquí viaja
      solo metadata + referencia.
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      device: { description: ID de la cámara }
    messages:
      capture:
        $ref: '#/components/messages/CameraCapture'

  fieldEvent:
    address: terraos/{tenant}/{parcela}/event/{type}
    description: |
      Eventos de dominio del campo. {type}: dosing_started | dosing_done |
      recirculation_started | recirculation_stopped | refill_started |
      refill_stopped | sensor_failed | sensor_recovered | device_offline |
      device_online | task_created | task_done | alert
    parameters:
      tenant: { description: ID de finca }
      parcela: { description: ID de parcela/módulo }
      type: { description: Tipo de evento }
    messages:
      event:
        $ref: '#/components/messages/FieldEvent'

  policyAudit:
    address: terraos/{tenant}/policy/audit
    description: |
      Registro de cada decisión del policy module: propuesta (agente o
      humano), validación, aprobación, ejecución. Inmutable, solo-append.
    parameters:
      tenant: { description: ID de finca }
    messages:
      audit:
        $ref: '#/components/messages/PolicyAudit'

operations:
  publishTelemetry:
    action: send
    channel: { $ref: '#/channels/telemetry' }
  receiveTelemetry:
    action: receive
    channel: { $ref: '#/channels/telemetry' }
  publishDeviceStatus:
    action: send
    channel: { $ref: '#/channels/deviceStatus' }
  receiveDeviceStatus:
    action: receive
    channel: { $ref: '#/channels/deviceStatus' }
  sendActuatorCommand:
    action: send
    channel: { $ref: '#/channels/actuatorCommand' }
  receiveActuatorState:
    action: receive
    channel: { $ref: '#/channels/actuatorState' }
  sendHumanRequest:
    action: send
    channel: { $ref: '#/channels/humanRequest' }
  receiveHumanRequest:
    action: receive
    channel: { $ref: '#/channels/humanRequest' }
  publishCameraCapture:
    action: send
    channel: { $ref: '#/channels/cameraCapture' }
  publishFieldEvent:
    action: send
    channel: { $ref: '#/channels/fieldEvent' }
  publishPolicyAudit:
    action: send
    channel: { $ref: '#/channels/policyAudit' }

components:
  messages:
    SensorReading:
      payload:
        type: object
        required: [ts, value, unit]
        properties:
          ts: { type: string, format: date-time }
          value: { type: number, description: 'Valor según métrica' }
          unit: { type: string, enum: [ms_cm, ph, celsius, percent, liters, lpm, volts, dbm] }
          quality: { type: string, enum: [good, degraded, estimated], default: good }
          battery_pct: { type: number, minimum: 0, maximum: 100 }
        additionalProperties: false

    DeviceStatus:
      payload:
        type: object
        required: [ts, status]
        properties:
          ts: { type: string, format: date-time }
          status: { type: string, enum: [online, offline, degraded] }
          detail: { type: string, description: 'Ej. batería baja, señal débil' }
          firmware: { type: string, description: 'Versión de firmware ESPHome' }
        additionalProperties: false

    ModuleConfidence:
      payload:
        type: object
        required: [ts, score]
        properties:
          ts: { type: string, format: date-time }
          score: { type: number, minimum: 0, maximum: 100, description: 'Confianza global del módulo (0-100)' }
          per_variable:
            type: object
            description: 'Confianza por variable, ej. {"ec": 82, "ph": 0, "tank_level": 95}'
            additionalProperties: { type: number, minimum: 0, maximum: 100 }
          blocking:
            type: array
            items: { type: string }
            description: 'Variables bajo el umbral que bloquean acciones (ej. ph para dosificar)'
        additionalProperties: false

    ActuatorCommand:
      payload:
        type: object
        required: [ts, action, policy_id]
        properties:
          ts: { type: string, format: date-time }
          action: { type: string, enum: [open, close, start, stop, set, dose] }
          value: { type: number, description: 'Ej. ml a dosificar, porcentaje de apertura, caudal objetivo' }
          duration_s: { type: integer, minimum: 0, description: 'Duración máxima; el edge MUST cortar al cumplirla' }
          policy_id: { type: string, format: uuid, description: 'ID del registro del policy module que autoriza este comando. Obligatorio.' }
        additionalProperties: false

    ActuatorState:
      payload:
        type: object
        required: [ts, state, policy_id]
        properties:
          ts: { type: string, format: date-time }
          state: { type: string, enum: [ack, executing, done, rejected, interlock_blocked, failed] }
          policy_id: { type: string, format: uuid, description: 'Eco del policy_id del comando' }
          detail: { type: string, description: 'Motivo si rejected/interlock_blocked/failed' }
        additionalProperties: false

    HumanRequest:
      payload:
        type: object
        required: [ts, action, requested_by]
        properties:
          ts: { type: string, format: date-time }
          action: { type: string, enum: [open, close, start, stop, set, dose] }
          value: { type: number }
          duration_s: { type: integer, minimum: 0 }
          requested_by: { type: string, description: 'Identidad del humano (usuario HA)' }
        additionalProperties: false

    CameraCapture:
      payload:
        type: object
        required: [ts, object_key]
        properties:
          ts: { type: string, format: date-time }
          object_key: { type: string, description: 'Clave del objeto en MinIO' }
          trigger: { type: string, enum: [schedule, agent_request, event], default: schedule }
          width_px: { type: integer }
          height_px: { type: integer }
        additionalProperties: false

    FieldEvent:
      payload:
        type: object
        required: [ts, summary]
        properties:
          ts: { type: string, format: date-time }
          summary: { type: string, description: 'Descripción corta del evento' }
          severity: { type: string, enum: [info, warning, critical], default: info }
          data: { type: object, description: 'Datos específicos del tipo de evento' }
        additionalProperties: false

    PolicyAudit:
      payload:
        type: object
        required: [ts, policy_id, action_class, verdict]
        properties:
          ts: { type: string, format: date-time }
          policy_id: { type: string, format: uuid }
          action_class: { type: string, description: 'Ej. dosificacion, recirculacion, relleno, gasto' }
          requested_by: { type: string, description: 'Quién propuso: agente, usuario HA, o regla' }
          verdict: { type: string, enum: [approved, rejected, pending_human, executed, failed] }
          approved_by: { type: string, description: 'Humano aprobador si aplica' }
          reason: { type: string }
        additionalProperties: false
