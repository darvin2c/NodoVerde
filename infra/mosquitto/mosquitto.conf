# Mosquitto Fase 0 — dev LAN only
# allow_anonymous true para desarrollo en LAN.
# PRODUCCION Fase 5 exige TLS + auth (usuario/clave o mTLS) y allow_anonymous false.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
connection_messages true
