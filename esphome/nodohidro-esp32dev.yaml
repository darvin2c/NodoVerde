# ==============================================================================
# MQTT — plano dispositivo (5 segmentos). La plataforma traduce a plano interno.
# Estado: terra/{hw_id}/controller/status/status (retained, birth/will)
# El router publica discovery HA (homeassistant/.../config) en plano interno;
# este firmware NUNCA publica discovery (dispositivo tonto).
# LWT: ESPHome solo soporta payload estático para will_message/birth_message
# (no admite lambda), por lo que se publica status online/offline con ts real
# en on_boot/on_shutdown y via intervalo. El will_message estático es fallback
# del broker con ts=0.
# ==============================================================================
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: 1883
  discovery: false
# Publicación periódica de status online cada 5 min (heartbeat para plataforma).
# Útil si sntp_time corrige ts o para renovar retain.
interval:
  - interval: 5min
    then:
      - mqtt.publish:
          topic: !lambda 'return "terra/" + id(hw_id) + "/controller/status/status";'
          payload: !lambda |-
            char buf[96];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"state\":\"online\",\"ts\":%lld}", ts);
            return std::string(buf);
# Nota: no hay on_message estático; las suscripciones a
# terra/{hw_id}/+/cmd (Fase 3, actuación con policy_id) y
# terra/{hw_id}/+/request/# (read/capture/calibrate) se crean en runtime en
# esphome.on_boot (prioridad 600) via esphome::mqtt::global_mqtt_client->subscribe(...)
# con hw_id ya derivado. El router traduce terra/{tenant}/{module}/{device}/cmd y
# .../request/{action} → terra/{hw_id}/...
