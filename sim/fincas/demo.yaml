# Finca demo — Lambayeque, Perú (hidroponía)
# Este archivo describe el MUNDO físico: los nodos de fábrica tal como salen
# de la línea de producción. Cada nodo se identifica por su hw_id (MAC sin
# dos puntos, 12 hex minúsculas). La identidad lógica (tenant/módulo/cultivo
# reclamado) NO vive aquí: vive en la DB vía claiming (ADR-0015). El router
# resuelve hw_id → (tenant, módulo) consultando device_identities.
# tenant: metadato de la finca simulada (no se usa en topics; el fierro jamás
#         conoce su tenant).
# location: coordenadas y nombre para ET0 Open-Meteo y dashboards
#   lat/lon: centro aproximado Lambayeque
#   name: etiqueta humana
# tank_liters: volumen útil del tanque por módulo (L) — base para modelo de nivel
# modules: lista de nodos físicos; cada hw_id es un dispositivo tonto (sin identidad)
tenant: demo # slug finca — metadato local, NO en MQTT (ADR-0015)
location: # ubicación para ET0 y dashboards
  lat: -6.7 # latitud Lambayeque
  lon: -79.9 # longitud Lambayeque
  name: Lambayeque # nombre humano de la zona
tank_liters: 200 # litros por tanque de módulo
modules: # 4 nodos del piloto Fase 0 (hw_ids determinísticos)
  - hw_id: "020000000001" # nodo 1
    crop: lechuga # ref: sim/config/crops/lechuga.yaml
  - hw_id: "020000000002" # nodo 2
    crop: lechuga
  - hw_id: "020000000003" # nodo 3
    crop: tomate # ref: sim/config/crops/tomate.yaml
  - hw_id: "020000000004" # nodo 4
    crop: lechuga
