name: terraos

networks:
  terra:
    driver: bridge

volumes:
  timescale_data:
  mosquitto_data:
  grafana_data:
  minio_data:
  ha_config:
  openclaw_state:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: terra-mosquitto
    restart: unless-stopped
    networks: [terra]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_data:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 2 | grep -q . || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  timescale:
    image: timescale/timescaledb-ha:pg17
    container_name: terra-timescale
    restart: unless-stopped
    networks: [terra]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/db/migrations/002-fase1.sql:/docker-entrypoint-initdb.d/02-fase1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terra} -d ${POSTGRES_DB:-terra}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  telegraf:
    image: telegraf:1.34
    container_name: terra-telegraf
    restart: unless-stopped
    networks: [terra]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      timescale:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.0
    container_name: terra-grafana
    restart: unless-stopped
    networks: [terra]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescale:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: terra-minio
    restart: unless-stopped
    networks: [terra]
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    networks: [terra]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb -p local/terra-media || true;
      echo 'bucket terra-media ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: terra-ha
    restart: unless-stopped
    networks: [terra]
    ports:
      - "8124:8123" # 8123 del host lo ocupa TerraSmart (app preexistente del usuario)
    volumes:
      - ha_config:/config
      - ./infra/homeassistant/configuration.yaml:/config/configuration.yaml:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  # LABORATORIO (ADR-0017) — monitor del simulador, NO del producto.
  # Observa física (:7751) + ctl (:7750) del host y el MQTT de laboratorio.
  # Dashboard: http://localhost:1880/dashboard · Editor: http://localhost:1880
  nodered:
    build: ./sim/nodered
    container_name: terra-nodered
    restart: unless-stopped
    networks: [terra]
    ports:
      - "1880:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway" # el sim corre en el host (pnpm dev)
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1880/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  # CEREBRO (ADR-0001/0012/0019 Fase 1) — OpenClaw gateway 24/7, multi-agente (orquestador + expertos)
  # Imagen OFICIAL pre-construida (ADR-0018) — prohibido build desde fuente/fork.
  # Tags disponibles: versionados (2026.7.1-2), latest, extended-stable. Verificar: docker manifest inspect ghcr.io/openclaw/openclaw:<tag>
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2
    container_name: terra-openclaw
    restart: unless-stopped
    networks: [terra]
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # LLM agnóstico (ADR-0001): descomenta/añade la env del proveedor que elijas
      # y luego: openclaw config set agents.defaults.model.primary <proveedor/modelo>
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Canal agnóstico: idem con tu canal (ej. TELEGRAM_BOT_TOKEN para Telegram)
      # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: America/Lima
    ports:
      - "18789:18789"
    volumes:
      - openclaw_state:/home/node/.openclaw
      - ./brain/workspaces:/home/node/.openclaw/workspaces
      - ./brain/openclaw.json:/home/node/.openclaw/openclaw.json
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Fase 1 — servicios de dominio (ADR-0010) ──

  # Watchdog: salud de dispositivos (silencio/congelado/imposible/LWT) → health + alert
  watchdog:
    build: ./services/watchdog
    container_name: terra-watchdog
    restart: unless-stopped
    networks: [terra]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy

  # Termómetro de confianza (cálculo determinístico, NUNCA el LLM) → confidence retenido por módulo
  confidence:
    build: ./services/confidence
    container_name: terra-confidence
    restart: unless-stopped
    networks: [terra]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy

  # MCP read-only del dominio: las únicas herramientas del cerebro sobre datos de negocio
  mcp-domain:
    build: ./services/mcp-domain
    container_name: terra-mcp-domain
    restart: unless-stopped
    networks: [terra]
    ports:
      - "7760:7760"
    environment:
      MCP_DOMAIN_PORT: "7760"
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      # Fase 4 (ADR-0021): memory_hash de campañas = sha256 del MEMORY.md del experto
      WORKSPACES_PATH: /workspaces
    volumes:
      - ./brain/workspaces:/workspaces:ro
    depends_on:
      timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7760/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Finance (Fase 2, ADR-0011): dueño único de movements. Auto-registro desde
  # dosificaciones (MQTT) + MCP read/write (registro por chat, anulaciones, costos).
  finance:
    build: ./services/finance
    container_name: terra-finance
    restart: unless-stopped
    networks: [terra]
    ports:
      - "7761:7761"
    environment:
      FINANCE_PORT: "7761"
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      timescale:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7761/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Portero (Fase 3, ADR-0012): gate de actuación — MCP terra-policy :7762 + HTTP /healthz + consumer MQTT
  policy:
    build: ./services/policy
    container_name: terra-policy
    restart: unless-stopped
    networks: [terra]
    ports:
      - "7762:7762"
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      POLICY_PORT: "7762"
      BRIDGE_URL: http://bridge:7765
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      POLICY_ADMIN_TOKEN: ${POLICY_ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7762/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Bridge MQTT→OpenClaw hooks (bus → cerebro). Observador: jamás publica cmd/request.
  bridge:
    build: ./services/bridge
    container_name: terra-bridge
    restart: unless-stopped
    networks: [terra]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      OPENCLAW_URL: http://openclaw:18789
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      BRIDGE_NAME: ${BRIDGE_NAME:-terra-bridge}
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      BRIDGE_HTTP_PORT: 7765
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy

  # Token-meter (Fase 4, ADR-0021 §4): contabilidad determinística de tokens del cerebro.
  # Lee sesiones JSONL de OpenClaw (ro), calcula USD con tabla de precios propia (código,
  # cero LLM), registra movimiento diario categoría software en el ledger vía MCP finance
  # y alerta budget_tokens si el mes supera el techo. Sin TOKEN_PRICE_TABLE no registra
  # (alerta unknown_model — jamás fabrica costos).
  token-meter:
    build: ./services/token-meter
    container_name: terra-token-meter
    restart: unless-stopped
    networks: [terra]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      FINANCE_MCP_URL: http://finance:7761/mcp
      OPENCLAW_STATE_PATH: /openclaw
      TENANT: ${TENANT:-demo}
      TOKEN_PRICE_TABLE: ${TOKEN_PRICE_TABLE:-}
      TOKEN_BUDGET_USD_MONTHLY: ${TOKEN_BUDGET_USD_MONTHLY:-50}
      SETTLE_INTERVAL_HOURS: ${SETTLE_INTERVAL_HOURS:-24}
    volumes:
      - openclaw_state:/openclaw:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy
      finance:
        condition: service_started

  # PWA terraOS — portada read-only (ADR-0014). tRPC server sirve API + frontend compilado.
  pwa:
    build: ./pwa
    container_name: terra-pwa
    restart: unless-stopped
    networks: [terra]
    ports:
      - "7780:7780"
    environment:
      PWA_SERVER_PORT: "7780"
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${POSTGRES_DB:-terra}
      MQTT_URL: mqtt://mosquitto:1883
      POLICY_URL: http://policy:7762
      POLICY_ADMIN_TOKEN: ${POLICY_ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescale:
        condition: service_healthy
