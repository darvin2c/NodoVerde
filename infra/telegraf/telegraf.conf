[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  omit_hostname = true

# --- INPUT: MQTT readings (6-seg interno tras router) ---
[[inputs.mqtt_consumer]]
  name_override = "telemetry"
  servers = ["tcp://mosquitto:1883"]
  topics = ["terra/+/+/+/+/reading"]
  topic_tag = "topic"
  qos = 1
  connection_timeout = "30s"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = []

# --- INPUT: MQTT confidence plataforma (4-seg, RETAINED qos1) ---
# Plano plataforma 4-seg: terra/{tenant}/{module}/confidence — publica services/confidence DIRECTO
# No pasa por router, no hay hw_id. Se historifica en confidence_history.
[[inputs.mqtt_consumer]]
  name_override = "confidence_history"
  servers = ["tcp://mosquitto:1883"]
  topics = ["terra/+/+/confidence"]
  topic_tag = "topic"
  qos = 1
  connection_timeout = "30s"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = []
  json_string_fields = ["sources"]

# --- INPUT: MQTT alerts plataforma (4-seg, NO retained qos1) ---
# Plano plataforma 4-seg: terra/{tenant}/{module}/alert — publica services/watchdog DIRECTO
# Health (4-seg retained) NO se ingesta — es estado vivo, no historia.
[[inputs.mqtt_consumer]]
  name_override = "alerts"
  servers = ["tcp://mosquitto:1883"]
  topics = ["terra/+/+/alert"]
  topic_tag = "topic"
  qos = 1
  connection_timeout = "30s"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  # name/severity/device van como FIELDS string (no tags): el parser json v1 descarta
  # campos string no declarados; si todos son tags el metric queda sin fields y se dropea
  # en silencio. json_string_fields los preserva. tenant/module salen del topic (regex).
  # detail llega APLANADO (detail_kind, detail_value...): las claves string se declaran
  # aquí o se pierden antes del starlark que las reempaca. Claves conocidas (watchdog):
  # kind, metric, from, to (strings) + value (numérica, sobrevive sola).
  # Fase 3 (verification_failed): detail_policy_id (string); baseline/last son numéricas.
  # Fase 4 (ADR-0021): cmd_sin_policy (topic/reason/state), data_gap (sin strings nuevas),
  # invariant_ledger (reason/movement_ids/state/fingerprint), budget_tokens (reason/state/fingerprint/month).
  # ADR-0028 (crop_out_of_range/crop_in_range): detail_crop (string); min/max son numéricas
  # y sobreviven solas, igual que value/threshold de level_low/level_ok.
  json_string_fields = ["name", "severity", "device", "detail_kind", "detail_metric", "detail_from", "detail_to", "detail_policy_id", "detail_topic", "detail_reason", "detail_state", "detail_fingerprint", "detail_movement_ids", "detail_month", "detail_crop"]

# Derive tenant/module/device/metric tags from MQTT topic (6-seg readings)
[[processors.regex]]
  order = 1
  namepass = ["telemetry"]
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${tenant}"
    result_key = "tenant"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${module}"
    result_key = "module"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${device}"
    result_key = "device"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${metric}"
    result_key = "metric"

# Derive tenant/module from MQTT topic (4-seg confidence)
[[processors.regex]]
  order = 5
  namepass = ["confidence_history"]
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/confidence$'
    replacement = "${tenant}"
    result_key = "tenant"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/confidence$'
    replacement = "${module}"
    result_key = "module"

# Derive tenant/module from MQTT topic (4-seg alert)
[[processors.regex]]
  order = 6
  namepass = ["alerts"]
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/alert$'
    replacement = "${tenant}"
    result_key = "tenant"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/alert$'
    replacement = "${module}"
    result_key = "module"

# Rename field v -> value (aplica a telemetry y confidence_history)
[[processors.rename]]
  order = 2
  [[processors.rename.replace]]
    field = "v"
    dest = "value"

# Keep only numeric value fields; drop raw topic tag after extraction
[[processors.converter]]
  order = 3
  namepass = ["telemetry", "confidence_history"]
  [processors.converter.fields]
    float = ["value"]

# Empaca sources_* (el parser json aplana el objeto sources) de vuelta a un string JSON
# Reempaca sources_* / detail_* (el parser json aplana objetos) a string JSON para la
# columna TEXT. Las claves string del detail deben declararse en json_string_fields arriba.
[[processors.starlark]]
  order = 6
  namepass = ["confidence_history"]
  source = '''
load("json.star", "json")
def apply(metric):
    src = {}
    for k in list(metric.fields.keys()):
        if k.startswith("sources_"):
            src[k[len("sources_"):]] = metric.fields.pop(k)
    if len(src) > 0:
        metric.fields["sources"] = json.encode(src)
    return metric
'''
[[processors.starlark]]
  order = 6
  namepass = ["alerts"]
  source = '''
load("json.star", "json")
def apply(metric):
    det = {}
    for k in list(metric.fields.keys()):
        if k.startswith("detail_"):
            det[k[len("detail_"):]] = metric.fields.pop(k)
    if len(det) > 0:
        metric.fields["detail"] = json.encode(det)
    return metric
'''

[[processors.converter]]
  order = 7
  namepass = ["confidence_history"]
  [processors.converter.fields]
    string = ["sources"]


[[processors.converter]]
  order = 8
  namepass = ["alerts"]
  [processors.converter.fields]
    string = ["detail", "name", "severity", "device"]

[[processors.strings]]
  order = 4
  [[processors.strings.trim]]
    tag = "topic"


# Remove helper topic tag is done via tagexclude in output, but also drop here if needed
# Using override to keep tags clean — tagexclude in output handles it.

# --- OUTPUT: TimescaleDB / Postgres ---
[[outputs.postgresql]]
  connection = "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescale:5432/${POSTGRES_DB}?sslmode=disable"
  tags_as_foreign_keys = false
  timestamp_column_name = "time"
  # Exclude helper topic tag
  tagexclude = ["topic", "host"]
  # Drop switch metric (string ON/OFF) — only numeric readings reach DB
  [outputs.postgresql.tagdrop]
    metric = ["switch"]
