# Perfil de cultivo: tomate hidropónico (sustrato / NFT)
# name: identificador del cultivo (coincide con filename y con sim/fincas/*/crop)
# ec_target: rango objetivo de conductividad eléctrica en mS/cm (más exigente que lechuga)
# ph_target: rango objetivo de pH
# water_temp: rango objetivo de temperatura del agua en °C
# notes: observaciones agronómicas breves
name: tomate # nombre del cultivo
ec_target: [2.0, 3.5] # mS/cm — 2.0 vegetativo, 2.5-3.5 floración/fructificación
ph_target: [5.5, 6.5] # pH ventana amplia; ajustar con pH-down (ácido nítrico/fosfórico)
water_temp: [18, 26] # °C agua — tolera más calor que lechuga, >26 estresa raíz
notes: "Tomate indeterminado hidropónico; EC se eleva progresivamente con carga de frutos. Vigilar blossom-end rot si EC/pH fuera de rango."
