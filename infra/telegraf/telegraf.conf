[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  omit_hostname = true

# --- INPUT: MQTT readings ---
[[inputs.mqtt_consumer]]
  name_override = "telemetry"
  servers = ["tcp://mosquitto:1883"]
  topics = ["terra/+/+/+/+/reading"]
  topic_tag = "topic"
  qos = 1
  connection_timeout = "30s"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = []

# Derive tenant/module/device/metric tags from MQTT topic
[[processors.regex]]
  order = 1
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${tenant}"
    result_key = "tenant"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${module}"
    result_key = "module"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${device}"
    result_key = "device"
  [[processors.regex.tags]]
    key = "topic"
    pattern = '^terra/(?P<tenant>[^/]+)/(?P<module>[^/]+)/(?P<device>[^/]+)/(?P<metric>[^/]+)/reading$'
    replacement = "${metric}"
    result_key = "metric"

# Rename field v -> value
[[processors.rename]]
  order = 2
  [[processors.rename.replace]]
    field = "v"
    dest = "value"

# Keep only numeric value fields; drop raw topic tag after extraction
[[processors.converter]]
  order = 3
  [processors.converter.fields]
    float = ["value"]

# Drop non-numeric / switch metrics — switch arrives as string ON/OFF
# Filter at converter stage: if conversion fails, value stays string; we drop via starlark or output tagdrop.
# Simplest: drop metric=switch via tagdrop at output (see below). Also drop helper topic tag.

[[processors.strings]]
  order = 4
  [[processors.strings.trim]]
    tag = "topic"

# Remove helper topic tag is done via tagexclude in output, but also drop here if needed
# Using override to keep tags clean — tagexclude in output handles it.

# --- OUTPUT: TimescaleDB / Postgres ---
[[outputs.postgresql]]
  connection = "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescale:5432/${POSTGRES_DB}?sslmode=disable"
  tags_as_foreign_keys = false
  timestamp_column_name = "time"
  # Exclude helper topic tag
  tagexclude = ["topic", "host"]
  # Drop switch metric (string ON/OFF) — only numeric readings reach DB
  [outputs.postgresql.tagdrop]
    metric = ["switch"]
