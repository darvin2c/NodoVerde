asyncapi: "3.0.0"
info:
  title: terraOS Bus Contract
  version: 0.5.0
  description: |
    Contrato AUTORITATIVO del bus MQTT de terraOS (ADR-0003, ADR-0015, ADR-0010).
    Toda comunicación sim/edge/router/cerebro pasa por aquí.

    Tres planos distinguibles por número de segmentos:

    PLANO DISPOSITIVO — lo que publica y escucha el fierro (5 segmentos, hw_id de fábrica):
      terra/{hw_id}/{device}/{metric}/reading
      terra/{hw_id}/{device}/{metric}/event
      terra/{hw_id}/{device}/status/status
      terra/{hw_id}/{device}/confidence/confidence
      terra/{hw_id}/{device}/request/{action}        (el fierro ESCUCHA; action ∈ set|read|capture|calibrate)

      - hw_id: 12 hex minúsculas (MAC de fábrica sin dos puntos). Demo: 020000000001..020000000004.
      - device: ec-01, ph-01, temp-01, level-01, flow-01, climate-01,
                pump-recirc-01, valve-fill-01, doser-a-01, doser-b-01, doser-ph-01, cam-01
      - metric: ec | ph | temp | level | flow | air_temp | humidity | switch | photo | confidence
      - El hardware JAMÁS conoce tenant/module/cultivo; solo su hw_id.

    PLANO INTERNO — resuelto por el router; consumen HA/Telegraf/cerebro/Grafana (6 segmentos):
      terra/{tenant}/{module}/{device}/{metric}/reading
      terra/{tenant}/{module}/{device}/{metric}/event
      terra/{tenant}/{module}/{device}/status/status
      terra/{tenant}/{module}/{device}/confidence/confidence
      terra/{tenant}/{module}/{device}/request/{action}
      terra/{tenant}/{module}/{device}/cmd
      homeassistant/{component}/{unique_id}/config

      - tenant: slug de finca (demo en Fase 0)
      - module: mod-1..mod-4 (escalable a árbol parent_id en DB, ADR-0016)
      - device/metric: idénticos al plano dispositivo

    PLANO PLATAFORMA — servicios de dominio publican DIRECTAMENTE al plano interno (4 segmentos, no pasa por router, no hay hw_id):
      terra/{tenant}/{module}/confidence          (RETAINED qos1 — publica services/confidence)
      terra/{tenant}/{module}/health              (RETAINED qos1 — publica services/watchdog)
      terra/{tenant}/{module}/alert               (NO retained qos1 — publica services/watchdog)

      - confidence — termómetro global por módulo (ADR-0010). Payload Confidence {v: 0-100, ts: epoch_ms, sources: {ec?, ph?, temp?, level?, flow?, air_temp?, humidity?, photo?}}.
        Publica: services/confidence. Es el termómetro global por módulo. Cálculo: confianza por variable = base_fuente × decaimiento_edad.
        Base: sensor en vivo = min(95, confianza publicada por el dispositivo si existe); foto=75; reporte humano=65; sin dato=0.
        Decaimiento por semivida: level 10min, ec 2h, ph 2h, temp 30min, flow 5min, air_temp/humidity 30min, photo 6h.
        Global = promedio ponderado (pesos: ec 3, ph 3, temp 2, level 2, flow 1, air_temp 1, humidity 1, photo 1). Nunca 100.
        RETAINED qos1. Consumen: HA/PWA/Grafana/Telegraf/cerebro. Se historifica en TimescaleDB (confidence_history).
      - health — estado vivo por módulo. Payload Health {state: ok|degraded|offline|blind, ts: epoch_ms, devices: {<deviceId>: ok|silence|frozen|impossible|offline}}.
        Publica: services/watchdog. blind = todos los sensores del módulo sin dato (señal de oficina activa). RETAINED qos1.
        Consumen: HA/PWA/cerebro. NO se historifica (estado vivo, no historia).
      - alert — transiciones de salud. Payload Alert {name, ts, severity: info|warn|critical, device?, detail?}.
        Publica: watchdog (transiciones: device_silence, device_frozen, device_impossible, device_offline, device_recovered, module_blind, module_recovered).
        NO retained, qos1. Consumen: HA/PWA/Grafana/Telegraf/cerebro. Se historifica en TimescaleDB (alerts).

      - Quién PUBLICA: servicios de dominio (confidence, watchdog) DIRECTAMENTE. CERO actuación: ningún componente nuevo publica a cmd ni a request/.
      - Quién CONSUME: HA / PWA / Grafana / Telegraf / cerebro (OpenClaw) / portero.
      - Distinguible por nº de segmentos: plataforma=4, dispositivo=5, interno=6.

    Router de identidad (router/):
      - device→interno: subscribe plano dispositivo; resuelve hw_id→(tenant,module) en
        device_identities (cache con refresh); republica en plano interno con payload idéntico.
        hw_id desconocido → log + descartar.
      - interno→device: subscribe terra/+/+/+/request/#; resuelve (tenant,module)→hw_id;
        republica como terra/{hw_id}/{device}/request/{action}, payload intacto, qos1.
      - HA discovery: lo publica el router (nunca el dispositivo) al resolver un hw_id
        conocido por primera vez; state_topics con 6 segmentos.

    Reglas:
    - Solo lecturas instantáneas viajan por el bus. Historia y agregaciones: TimescaleDB.
    - Retain: status (ambos planos), confidence y health de plataforma (retained), y readings de switches retenidos; alerts NO retained. HA discovery retenido.
    - LWT: cada dispositivo registra offline en terra/{hw_id}/{device}/status/status; el router
      lo traduce al plano interno.
    - QoS: sensores qos según kind (el sim hoy usa qos0 para lecturas — se mantiene por kind);
      request/cmd qos1; status/health/confidence qos1 retained; alert qos1.
    - Timestamps: epoch milisegundos (entero, campo ts).
    - Home Assistant discovery: homeassistant/{component}/{unique_id}/config (retenido),
      publicado por el router; state_topic apunta al plano interno (6 segmentos).
    - Actuadores en plano interno reciben SOLO por cmd (con policy_id, desde el portero) y
      por request/{action} (solicitudes humanas validadas por el portero).
      EXCEPCIÓN dev Fase 0: HA publica a request/set (payload ON/OFF) y el sim actúa de portero.
    - Fase 1 CERO actuación: ningún componente nuevo publica a cmd ni a request/.

    Historial:
    - v0.5.0 (2026-08-16, ADR-0010 + Fase 1 "Cerebro observador"): plano plataforma 4-seg (confidence/health/alert por módulo).
      Health y Alert schemas nuevos. Confidence/sources extendido con termómetro global ponderado y decaimiento por semivida. CERO actuación en Fase 1.
      Servicios de dominio publican DIRECTO al plano interno (no pasa por router). Health retained no se ingesta; confidence y alert se historifican.
    - v0.4.0 (2026-08-16, ADR-0015): plano dispositivo por hw_id (5 seg), identidad dinámica
      vía DB (device_identities) + router. HA discovery pasa a publicarlo la plataforma.
      Plano interno (6 seg) idéntico al contrato v0.3.0. Spec desactualizado previo
      (namespace terraos/{tenant}/{parcela}/... ) eliminado por no estar implementado.
    - v0.3.0: +canal confidence por módulo (ADR-0010), eventos task_created/task_done.
    - v0.2.0: +device/status (retained + LWT), +solicitudes humanas (ADR-0009).

servers:
  mosquitto:
    host: localhost:1883
    protocol: mqtt
    description: Broker único (Mosquitto). En producción en VPS; edge con bridge local (ADR-0006). Env MQTT_URL.

channels:
  # ── Plano dispositivo (5 segmentos — el fierro) ──
  deviceReading:
    address: terra/{hw_id}/{device}/{metric}/reading
    description: Lectura del fierro (plano dispositivo, 5 seg). El router la traduce a terra/{tenant}/{module}/... si hw_id conocido.
    parameters:
      hw_id: { description: "ID de fábrica: 12 hex minúsculas (MAC sin dos puntos)" }
      device: { description: "ID del dispositivo" }
      metric: { description: "Métrica reportada" }
    messages:
      reading:
        payload: { $ref: "#/components/schemas/Reading" }

  deviceEvent:
    address: terra/{hw_id}/{device}/{metric}/event
    description: |
      Evento del fierro (plano dispositivo, 5 seg).
      Eventos de dosis (Fase 2): dose_a_end/dose_b_end/dose_ph_end con detail {device, duration_ms, ml}
      donde duration_ms = duración real del pulso del dosificador y ml = round(duration_ms/1000 * doserMlPerSecond *100)/100
      (doserMlPerSecond=1.5 ml/s por defecto, expuesto por la física en GET /api/nodes/{hw_id}/state).
    parameters:
      hw_id: { description: "ID de fábrica" }
      device: { description: "ID del dispositivo" }
      metric: { description: "Métrica" }
    messages:
      event:
        payload: { $ref: "#/components/schemas/Event" }

  deviceStatus:
    address: terra/{hw_id}/{device}/status/status
    description: |
      Estado de vida del dispositivo (plano dispositivo, 5 seg). RETAINED + LWT (offline).
      El router lo republica en el plano interno.
    parameters:
      hw_id: { description: "ID de fábrica" }
      device: { description: "ID del dispositivo" }
    messages:
      status:
        payload: { $ref: "#/components/schemas/Status" }

  deviceConfidence:
    address: terra/{hw_id}/{device}/confidence/confidence
    description: Confianza del dispositivo (plano dispositivo, 5 seg).
    parameters:
      hw_id: { description: "ID de fábrica" }
      device: { description: "ID del dispositivo" }
    messages:
      confidence:
        payload: { $ref: "#/components/schemas/Confidence" }

  deviceRequest:
    address: terra/{hw_id}/{device}/request/{action}
    description: |
      El fierro ESCUCHA solicitudes aquí (plano dispositivo, 5 seg). El router traduce
      desde terra/{tenant}/{module}/{device}/request/{action}. action ∈ set|read|capture|calibrate.
    parameters:
      hw_id: { description: "ID de fábrica" }
      device: { description: "ID del dispositivo" }
      action: { description: "Acción solicitada", enum: [set, read, capture, calibrate] }
    messages:
      request:
        payload: { $ref: "#/components/schemas/Request" }

  # ── Plano interno (6 segmentos — plataforma) ──
  reading:
    address: terra/{tenant}/{module}/{device}/{metric}/reading
    description: Lectura en plano interno (6 seg). Publicada por el router tras resolver hw_id.
    parameters:
      tenant: { description: "Slug de finca (demo en Fase 0)" }
      module: { description: "ID de módulo" }
      device: { description: "ID del dispositivo" }
      metric: { description: "Métrica reportada" }
    messages:
      reading:
        payload: { $ref: "#/components/schemas/Reading" }

  event:
    address: terra/{tenant}/{module}/{device}/{metric}/event
    description: |
      Evento en plano interno (6 seg).
      Eventos de dosis (Fase 2, traducidos por el router desde el plano dispositivo):
      dose_a_end/dose_b_end/dose_ph_end con detail {device, duration_ms, ml} donde
      duration_ms = duración real del pulso y ml = round(duration_ms/1000 * doserMlPerSecond *100)/100
      (doserMlPerSecond=1.5 ml/s por defecto). El schema Event.detail es free-form; solo se documenta aquí.
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
      device: { description: "ID del dispositivo" }
      metric: { description: "Métrica" }
    messages:
      event:
        payload: { $ref: "#/components/schemas/Event" }
  status:
    address: terra/{tenant}/{module}/{device}/status/status
    description: |
      Estado de vida en plano interno (6 seg). RETAINED + LWT (traducido del plano dispositivo).
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
      device: { description: "ID del dispositivo" }
    messages:
      status:
        payload: { $ref: "#/components/schemas/Status" }

  confidence:
    address: terra/{tenant}/{module}/{device}/confidence/confidence
    description: Confianza en plano interno (6 seg).
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
      device: { description: "ID del dispositivo" }
    messages:
      confidence:
        payload: { $ref: "#/components/schemas/Confidence" }

  cmd:
    address: terra/{tenant}/{module}/{device}/cmd
    description: Comando a actuador en plano interno (6 seg). Solo el policy module publica aquí.
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
      device: { description: "ID del actuador" }
    messages:
      cmd:
        payload: { $ref: "#/components/schemas/Cmd" }

  request:
    address: terra/{tenant}/{module}/{device}/request/{action}
    description: |
      Solicitud humana o del cerebro en plano interno (6 seg). El router la traduce
      a terra/{hw_id}/{device}/request/{action} si (tenant,module) tiene hw_id asignado.
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
      device: { description: "ID del dispositivo" }
      action: { description: "Acción solicitada", enum: [set, read, capture, calibrate, start, stop] }
    messages:
      request:
        payload: { $ref: "#/components/schemas/Request" }

  haDiscovery:
    address: homeassistant/{component}/{device_id}/config
    description: |
      Discovery de Home Assistant (retenido). LO PUBLICA EL ROUTER, nunca el dispositivo.
      unique_id y state_topic usan el plano interno (6 segmentos).
    parameters:
      component: { description: "Componente HA: sensor, switch, etc." }
      device_id: { description: "unique_id del dispositivo" }
    messages:
      haDiscovery:
        payload: { $ref: "#/components/schemas/HaDiscovery" }

  # ── Plano plataforma (4 segmentos — servicios de dominio DIRECTO) ──
  moduleConfidence:
    address: terra/{tenant}/{module}/confidence
    description: |
      Confianza global por módulo (plano plataforma, 4 seg). RETAINED qos1.
      Lo publica DIRECTAMENTE services/confidence (sin pasar por router, no hay hw_id). CERO actuación.
      Consumen: HA/PWA/Grafana/Telegraf/cerebro. Se historifica en TimescaleDB (confidence_history).
      Termómetro global ADR-0010: v 0-100, sources con peso ponderado (ec 3, ph 3, temp 2, level 2, flow 1, air_temp 1, humidity 1, photo 1), decaimiento por semivida. Nunca 100.
    parameters:
      tenant: { description: "Slug de finca (demo)" }
      module: { description: "ID de módulo" }
    messages:
      moduleConfidence:
        payload: { $ref: "#/components/schemas/Confidence" }

  moduleHealth:
    address: terra/{tenant}/{module}/health
    description: |
      Salud por módulo (plano plataforma, 4 seg). RETAINED qos1.
      Lo publica DIRECTAMENTE services/watchdog. Estado vivo, NO se historifica.
      Consumen: HA/PWA/cerebro. blind = todos los sensores del módulo sin dato.
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
    messages:
      moduleHealth:
        payload: { $ref: "#/components/schemas/Health" }

  moduleAlert:
    address: terra/{tenant}/{module}/alert
    description: |
      Alerta por módulo (plano plataforma, 4 seg). NO retained, qos1.
      Lo publica services/watchdog en transiciones: device_silence, device_frozen, device_impossible, device_offline, device_recovered, module_blind, module_recovered.
      Consumen: HA/PWA/Grafana/Telegraf/cerebro. Se historifica en TimescaleDB (alerts).
    parameters:
      tenant: { description: "Slug de finca" }
      module: { description: "ID de módulo" }
    messages:
      moduleAlert:
        payload: { $ref: "#/components/schemas/Alert" }

components:
  schemas:
    Reading:
      type: object
      required: [v, ts]
      properties:
        v:
          description: Valor numérico (sensores) u "ON"/"OFF" (estado de switch)
        ts: { type: integer, description: epoch ms }
    Event:
      type: object
      required: [name, ts]
      properties:
        name: { type: string }
        ts: { type: integer, description: epoch ms }
        detail: { type: object, additionalProperties: true }
    Status:
      type: object
      required: [state, ts]
      properties:
        state: { type: string, enum: [online, offline, error] }
        ts: { type: integer, description: epoch ms }
        meta: { type: object, additionalProperties: true }
    Confidence:
      type: object
      required: [v, ts]
      properties:
        v: { type: number, minimum: 0, maximum: 100 }
        ts: { type: integer, description: epoch ms }
        sources:
          type: object
          additionalProperties: { type: number }
          description: "desglose por fuente (ADR-0010). Fase 0 sim publica self=100. Fase 1 módulo: {ec?, ph?, temp?, level?, flow?, air_temp?, humidity?, photo?} con pesos ec 3, ph 3, temp 2, level 2, flow 1, air_temp 1, humidity 1, photo 1."
    Health:
      type: object
      required: [state, ts, devices]
      properties:
        state:
          type: string
          enum: [ok, degraded, offline, blind]
          description: blind = todos los sensores del módulo sin dato (señal de oficina activa)
        ts: { type: integer, description: epoch ms }
        devices:
          type: object
          additionalProperties:
            type: string
            enum: [ok, silence, frozen, impossible, offline]
          description: estado por deviceId
    Alert:
      type: object
      required: [name, ts, severity]
      properties:
        name:
          type: string
          description: "ej: device_silence, device_frozen, device_impossible, device_offline, device_recovered, module_blind, module_recovered"
        ts: { type: integer, description: epoch ms }
        severity:
          type: string
          enum: [info, warn, critical]
        device:
          type: string
          description: deviceId opcional (cuando la alerta es por dispositivo)
        detail:
          type: object
          additionalProperties: true
          description: |
            Contexto opcional de la alerta. DEBE ser plano de escalares (string/number/bool)
            — Telegraf aplana el objeto un nivel para historificar (detail_*) y las claves
            string nuevas deben declararse en infra/telegraf/telegraf.conf json_string_fields.
            Claves en uso (watchdog): kind, metric, value, from, to.
    Cmd:
      type: object
      required: [action, policy_id]
      properties:
        action: { type: string, enum: [start, stop, set] }
        policy_id: { type: string }
        params: { type: object, additionalProperties: true }
    Request:
      description: |
        Solicitud humana (ADR-0009). Actuador: action=start|stop|set. Sensor: read|calibrate.
        Cámara: capture. En dev Fase 0, HA switch publica payload crudo ON/OFF a request/set.
      oneOf:
        - type: string # crudo Fase 0: "ON" | "OFF"
        - type: object # forma futura: {"v": ...} | {"action": ...}
          additionalProperties: true
    HaDiscovery:
      type: object
      description: Config de discovery de Home Assistant (sensor/switch/camera)
      additionalProperties: true

  deviceMetrics:
    description: |
      Mapa dispositivo -> métricas que publica:
      ec-01: [ec]                      (mS/cm)
      ph-01: [ph]
      temp-01: [temp]                  (°C agua)
      level-01: [level]                (% tanque)
      flow-01: [flow]                  (L/min, 0 cuando recirculación apagada)
      climate-01: [air_temp, humidity] (°C aire, %HR)
      pump-recirc-01: [switch]
      valve-fill-01: [switch]
      doser-a-01, doser-b-01, doser-ph-01: [switch]  (ON durante pulsos de dosificación)
      cam-01: [photo]                  (event: captura; imagen va a MinIO, Fase 0 solo evento)
