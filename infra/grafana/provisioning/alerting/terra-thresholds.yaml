apiVersion: 1
groups:
  - orgId: 1
    name: terra-thresholds
    folder: terra
    interval: 1m
    rules:
      - uid: ec-out-of-range
        title: "EC fuera de rango por modulo"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warn
        annotations:
          summary: "EC fuera de rango (1.2-3.5 mS/cm) — revisar dosificacion y crop_profiles"
          description: "Valor EC por modulo fuera de rango esperado. Query: ultima lectura por modulo (reducer last)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: timescale
            model:
              refId: A
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: "SELECT time, module AS metric, value FROM telemetry WHERE metric = 'ec' AND $__timeFilter(time) ORDER BY time"
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: outside_range
                    params: [1.2, 3.5]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []

      - uid: ph-out-of-range
        title: "pH fuera de rango por modulo"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warn
        annotations:
          summary: "pH fuera de rango (5.5-6.5) — revisar doser pH y perfil de cultivo"
          description: "Valor pH por modulo fuera de rango. Query: ultima lectura por modulo (reducer last)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: timescale
            model:
              refId: A
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: "SELECT time, module AS metric, value FROM telemetry WHERE metric = 'ph' AND $__timeFilter(time) ORDER BY time"
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: outside_range
                    params: [5.5, 6.5]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []

      - uid: level-low
        title: "Nivel tanque < 15%"
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Nivel de tanque por debajo de 15% — riesgo de cavitacion"
          description: "Nivel de agua por modulo <15%. Query: ultima lectura por modulo (reducer last)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: timescale
            model:
              refId: A
              format: time_series
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: "SELECT time, module AS metric, value FROM telemetry WHERE metric = 'level' AND $__timeFilter(time) ORDER BY time"
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [15]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
