# ==============================================================================
# ESPECIFICACIÓN — módulo hidropónico terraOS (Fase 0)
# Este archivo ES la especificación del dispositivo real. Se compila y flashea
# en Fase 5 tal cual (ESP32 + periféricos reales). En Fase 0 el simulador
# corre en modo host fingiendo estos mismos dispositivos (mismo contrato MQTT).
# Clonar para mod-2..mod-4 cambiando solo substitutions.module (y tenant si aplica).
# Contrato autoritativo: contract/asyncapi.yaml (topics terra/{tenant}/{module}/{device}/{metric}/reading etc.)
# ==============================================================================
substitutions:
  tenant: demo # slug finca — mapea a {tenant} en topics MQTT
  module: mod-1 # id módulo — parametrizable: mod-1..mod-4 para clonar este YAML
  friendly_name: "Terra ${module}" # nombre visible en HA
  mqtt_broker: mqtt.finca.local # placeholder DNS finca; en dev es `mosquitto` (docker) o localhost
  wifi_ssid: "terra-farm"
  wifi_password: !secret wifi_password # en sim/host no se usa; en hardware real via secrets.yaml

esphome:
  name: terra-${module} # hostname mDNS / MQTT client_id base
  friendly_name: ${friendly_name}
  area: ${module}
  comment: "terraOS ${module} — spec Fase 0, hw Fase 5"
  on_boot:
    priority: -100
    then:
      # Publica status online con ts real (LWT es payload fijo sin ts; ver nota MQTT abajo)
      - mqtt.publish:
          topic: terra/${tenant}/${module}/controller/status/status
          payload: !lambda |-
            char buf[96];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"state\":\"online\",\"ts\":%lld}", ts);
            return std::string(buf);
          retain: true
          qos: 1

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

# En hardware real: WiFi. En sim modo host: ignorado (el sim publica directo por TCP).
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  ap:
    ssid: "Terra-${module}-Fallback"
    password: "terra1234"

captive_portal:

ota:
  - platform: esphome

api:
  encryption:
    key: !secret api_key

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Lima

# --- Bus I2C para ADS1115 + SHT3x ---
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

# --- OneWire para DS18B20 (temp agua) ---
one_wire:
  - platform: gpio
    pin: GPIO4

# --- ADS1115 16-bit ADC (EC en A0, pH en A1/A2) ---
ads1115:
  - address: 0x48 # dirección I2C fija del ADS1115

# ==============================================================================
# SENSORES — cada uno publica a terra/{tenant}/{module}/{device}/{metric}/reading
# Payload contrato Reading: {"v": <number|string>, "ts": <epoch_ms>}
# Filtros: delta (evita spam) + heartbeat 30s (Telegraf/Grafana esperan dato fresco)
# ts se genera con sntp_time.timestamp*1000; si no hay hora, fallback millis() (sim corrige)
# ==============================================================================

sensor:

  # -- EC vía ADS1115 canal A0 (sonda analógica EC, ej. DFR0300) --
  - platform: ads1115
    multiplexer: "A0_GND"
    gain: 4.096
    name: "EC raw"
    id: ec_raw
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 2
    on_value:
      then:
        - mqtt.publish:
            topic: terra/${tenant}/${module}/ec-01/ec/reading
            qos: 1
            retain: false
            payload: !lambda |-
              // Calibración lineal ejemplo: v -> mS/cm (ajustar con buffer de calibración)
              float volts = x;
              float ec =  (volts - 0.2) * 3.0; // placeholder: calibrar en Fase 5 con solución patrón
              if (ec < 0) ec = 0;
              char buf[80];
              auto t = id(sntp_time).now();
              long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
              // delta 0.02 mS/cm + heartbeat 30s (throttle) — no publicar si variación < delta salvo cada 30s
              static float last_v = -999;
              static long long last_ts = 0;
              long long now_ms = ts;
              if (last_v > -900 && fabs(ec - last_v) < 0.02 && (now_ms - last_ts) < 30000) return std::string("");
              last_v = ec; last_ts = now_ms;
              if (fabs(ec - last_v) < 0.001 && (now_ms - last_ts) < 30000) {} // keep
              snprintf(buf, sizeof(buf), "{\"v\":%.3f,\"ts\":%lld}", ec, ts);
              return std::string(buf);

  # -- pH vía ADS1115 canal A1 (segundo canal, sonda pH analógica) --
  - platform: ads1115
    multiplexer: "A1_GND"
    gain: 4.096
    name: "pH raw"
    id: ph_raw
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 2
    on_value:
      then:
        - mqtt.publish:
            topic: terra/${tenant}/${module}/ph-01/ph/reading
            qos: 1
            retain: false
            payload: !lambda |-
              float volts = x;
              // Sonda pH: 3.0V ~ pH 7, pendiente -5.5 aprox (calibrar con buffer 4/7/10)
              float ph = 7.0 + ((2.0 - volts) * 3.5);
              char buf[80];
              auto t = id(sntp_time).now();
              long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
              static float last_v = -999;
              static long long last_ts = 0;
              long long now_ms = ts;
              if (last_v > -900 && fabs(ph - last_v) < 0.02 && (now_ms - last_ts) < 30000) return std::string("");
              last_v = ph; last_ts = now_ms;
              snprintf(buf, sizeof(buf), "{\"v\":%.2f,\"ts\":%lld}", ph, ts);
              return std::string(buf);

  # -- Temperatura agua DS18B20 (one_wire GPIO4) --
  - platform: dallas_temp
    address: 0x0000000000000000  # placeholder; ESPHome resuelve en scan, se fija en Fase 5
    name: "Temp agua"
    id: temp_agua
    update_interval: 10s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1 # publica solo si cambia >0.1°C
    on_value:
      then:
        - mqtt.publish:
            topic: terra/${tenant}/${module}/temp-01/temp/reading
            qos: 1
            retain: false
            payload: !lambda |-
              char buf[80];
              auto t = id(sntp_time).now();
              long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
              snprintf(buf, sizeof(buf), "{\"v\":%.1f,\"ts\":%lld}", x, ts);
              return std::string(buf);

  # -- Nivel tanque: ultrasónico JSN-SR04T (trigger GPIO5, echo GPIO18) --
  # Alternativa presión analógica comentada abajo (usar via ADS1115 A2 si se prefiere sensor de presión).
  - platform: ultrasonic
    trigger_pin: GPIO5
    echo_pin: GPIO18
    pulse_time: 10us
    timeout: 4m
    name: "Nivel tanque"
    id: level_tank
    update_interval: 10s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 1
      - lambda: |-
          // Convertir distancia (m) a % tanque: 0.05m=100%, 0.85m=0% (tanque 200L ~0.8m alto)
          float dist = x;
          if (isnan(dist)) return {};
          float pct = (0.85 - dist) / 0.80 * 100.0;
          if (pct < 0) pct = 0; if (pct > 100) pct = 100;
          return pct;
      - delta: 1.0
    on_value:
      then:
        - mqtt.publish:
            topic: terra/${tenant}/${module}/level-01/level/reading
            qos: 1
            retain: false
            payload: !lambda |-
              char buf[80];
              auto t = id(sntp_time).now();
              long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
              snprintf(buf, sizeof(buf), "{\"v\":%.0f,\"ts\":%lld}", x, ts);
              return std::string(buf);

  # -- Alternativa nivel por presión analógica (descomentar si se usa sensor 0-5V en ADS1115 A2) --
  # - platform: ads1115
  #   multiplexer: "A2_GND"
  #   gain: 6.144
  #   name: "Nivel presión raw"
  #   id: level_pressure_raw
  #   update_interval: 10s
  #   filters:
  #     - lambda: |-
  #         float volts = x; // 0.5V=0% 4.5V=100%
  #         float pct = (volts - 0.5) / 4.0 * 100.0;
  #         if (pct < 0) pct = 0; if (pct > 100) pct = 100;
  #         return pct;
  #   on_value:
  #     then:
  #       - mqtt.publish:
  #           topic: terra/${tenant}/${module}/level-01/level/reading
  #           payload: !lambda ...

  # -- Caudalímetro por pulsos (YF-S201, pulse_counter GPIO15) --
  - platform: pulse_counter
    pin: GPIO15
    name: "Caudal"
    id: flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 10s
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    filters:
      - lambda: |-
          // YF-S201: ~450 pulsos/L => L/min = (pulsos/450) * (60/ventana)
          // ESPHome entrega pulsos por minuto normalizado
          float lpm = x / 450.0;
          return lpm;
      - delta: 0.05
    on_value:
      then:
        - mqtt.publish:
            topic: terra/${tenant}/${module}/flow-01/flow/reading
            qos: 1
            retain: false
            payload: !lambda |-
              char buf[80];
              auto t = id(sntp_time).now();
              long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
              // flow 0 cuando recirculación apagada — se publica igual por heartbeat
              snprintf(buf, sizeof(buf), "{\"v\":%.2f,\"ts\":%lld}", x, ts);
              return std::string(buf);

  # -- Clima aire: DHT22 (GPIO16) — alternativa SHT3x por I2C comentada --
  - platform: dht
    pin: GPIO16
    model: DHT22
    temperature:
      name: "Aire temp"
      id: air_temp
      on_value:
        then:
          - mqtt.publish:
              topic: terra/${tenant}/${module}/climate-01/air_temp/reading
              qos: 1
              retain: false
              payload: !lambda |-
                char buf[80];
                auto t = id(sntp_time).now();
                long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
                snprintf(buf, sizeof(buf), "{\"v\":%.1f,\"ts\":%lld}", x, ts);
                return std::string(buf);
    humidity:
      name: "Humedad aire"
      id: air_humidity
      on_value:
        then:
          - mqtt.publish:
              topic: terra/${tenant}/${module}/climate-01/humidity/reading
              qos: 1
              retain: false
              payload: !lambda |-
                char buf[80];
                auto t = id(sntp_time).now();
                long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
                snprintf(buf, sizeof(buf), "{\"v\":%.1f,\"ts\":%lld}", x, ts);
                return std::string(buf);
    update_interval: 30s

  # -- Alternativa SHT3x por I2C (más precisa, descomentar si se usa) --
  # - platform: sht3xd
  #   address: 0x44
  #   temperature:
  #     name: "Aire temp SHT"
  #     id: air_temp
  #     on_value: *mqtt_air_temp
  #   humidity:
  #     name: "Humedad SHT"
  #     id: air_humidity
  #     on_value: *mqtt_humidity
  #   update_interval: 30s

# ==============================================================================
# ACTUADORES — switches GPIO con interlock comentado
# Cada switch publica estado a terra/{tenant}/{module}/{device}/switch/reading
# y recibe comandos por terra/{tenant}/{module}/{device}/cmd (policy_id obligatorio)
# En Fase 0 HA publica a .../request/set (ON/OFF crudo) y el sim actúa de portero.
# Interlock Fase 5: dosificación solo si pump ON y nivel > mínimo. Aquí solo
# validación lógica comentada; el interlock físico real corta aunque falle software.
# ==============================================================================

switch:

  - platform: gpio
    pin: GPIO26
    id: pump_recirc
    name: "Bomba recirculación"
    icon: "mdi:pump"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/pump-recirc-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"ON\",\"ts\":%lld}", ts);
            return std::string(buf);
    on_turn_off:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/pump-recirc-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"OFF\",\"ts\":%lld}", ts);
            return std::string(buf);

  - platform: gpio
    pin: GPIO27
    id: valve_fill
    name: "Válvula relleno"
    icon: "mdi:valve"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/valve-fill-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"ON\",\"ts\":%lld}", ts);
            return std::string(buf);
    on_turn_off:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/valve-fill-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"OFF\",\"ts\":%lld}", ts);
            return std::string(buf);

  # Doser A — nutriente A (N-Ca-Fe)
  - platform: gpio
    pin: GPIO14
    id: doser_a
    name: "Dosificador A"
    icon: "mdi:flask"
    restore_mode: ALWAYS_OFF
    # INTERLOCK (Fase 5 físico, aquí validación lógica comentada):
    # - Solo dosificar si id(pump_recirc).state == ON
    # - Solo si id(level_tank).state > 10 (% mínimo para evitar cavitación)
    # - Ejemplo: on_turn_on con lambda que chequea y revierte si no cumple
    #   if (!id(pump_recirc).state || id(level_tank).state < 10) { id(doser_a).turn_off(); return; }
    on_turn_on:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-a-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            // interlock lógico (descomentar en Fase 5 real):
            // if (!id(pump_recirc).state) { id(doser_a).turn_off(); return std::string(""); }
            // if (id(level_tank).state < 10) { id(doser_a).turn_off(); return std::string(""); }
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"ON\",\"ts\":%lld}", ts);
            return std::string(buf);
    on_turn_off:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-a-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"OFF\",\"ts\":%lld}", ts);
            return std::string(buf);

  - platform: gpio
    pin: GPIO12
    id: doser_b
    name: "Dosificador B"
    icon: "mdi:flask-outline"
    restore_mode: ALWAYS_OFF
    # INTERLOCK idem doser-a-01 (solo con pump ON y nivel > 10%)
    on_turn_on:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-b-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"ON\",\"ts\":%lld}", ts);
            return std::string(buf);
    on_turn_off:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-b-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"OFF\",\"ts\":%lld}", ts);
            return std::string(buf);

  - platform: gpio
    pin: GPIO13
    id: doser_ph
    name: "Dosificador pH-down"
    icon: "mdi:eyedropper"
    restore_mode: ALWAYS_OFF
    # INTERLOCK idem doser-a-01; además evitar dosificar pH si pH ya < 5.5
    on_turn_on:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-ph-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"ON\",\"ts\":%lld}", ts);
            return std::string(buf);
    on_turn_off:
      - mqtt.publish:
          topic: terra/${tenant}/${module}/doser-ph-01/switch/reading
          qos: 1
          retain: true
          payload: !lambda |-
            char buf[80];
            auto t = id(sntp_time).now();
            long long ts = t.is_valid() ? (long long)t.timestamp * 1000 : (long long)millis();
            snprintf(buf, sizeof(buf), "{\"v\":\"OFF\",\"ts\":%lld}", ts);
            return std::string(buf);

# ==============================================================================
# MQTT — broker, discovery HA, LWT y comandos
# Contrato status: terra/{tenant}/{module}/{device}/status/status payload {"state":"online|offline|error","ts":...}
# NOTA ts en LWT: ESPHome solo soporta payload estático para will_message/birth_message,
#   por lo que LWT usa ts=0 fijo. Adaptación:
#   - En sim modo host: el sim publica status con ts real (epoch ms) por cada dispositivo lógico
#     (ec-01, ph-01, ... pump-..., etc.) y el LWT del board es solo fallback del broker.
#   - En hardware real Fase 5: automation on_boot publica retained online con ts de sntp_time;
#     on_shutdown publica offline con ts; y se añade lambda que re-publica status cada 5 min.
#   Ver https://esphome.io/components/mqtt — birth_message/will_message no admiten lambda.
# ==============================================================================

mqtt:
  broker: ${mqtt_broker}
  port: 1883
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: terra/${tenant}/${module}
  birth_message:
    topic: terra/${tenant}/${module}/controller/status/status
    payload: '{"state":"online","ts":0}'
    retain: true
    qos: 1
  will_message:
    topic: terra/${tenant}/${module}/controller/status/status
    payload: '{"state":"offline","ts":0}'
    retain: true
    qos: 1
  # Suscripción a comandos del portero: terra/{tenant}/{module}/{device}/cmd
  # Payload Cmd: {"action":"start|stop|set","policy_id":"uuid","params":{}}
  # En dev Fase 0 HA publica ON/OFF a terra/.../request/set (ver ADR-0009); el sim hace de portero.
  on_message:
    # Ejemplo pump-recirc-01 cmd
    - topic: terra/${tenant}/${module}/pump-recirc-01/cmd
      qos: 1
      then:
        - lambda: |-
            // Parse JSON mínimo; en sim real se valida policy_id y se audita.
            // Aquí solo mapea action -> switch: start/open/set+ON => ON, stop/close => OFF
            std::string s = x;
            if (s.find("\"start\"") != std::string::npos || s.find("\"open\"") != std::string::npos) id(pump_recirc).turn_on();
            else if (s.find("\"stop\"") != std::string::npos || s.find("\"close\"") != std::string::npos) id(pump_recirc).turn_off();
            else if (s.find("ON") != std::string::npos) id(pump_recirc).turn_on();
            else if (s.find("OFF") != std::string::npos) id(pump_recirc).turn_off();
    - topic: terra/${tenant}/${module}/valve-fill-01/cmd
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("\"start\"") != std::string::npos || s.find("\"open\"") != std::string::npos) id(valve_fill).turn_on();
            else if (s.find("\"stop\"") != std::string::npos || s.find("\"close\"") != std::string::npos) id(valve_fill).turn_off();
    - topic: terra/${tenant}/${module}/doser-a-01/cmd
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("\"start\"") != std::string::npos || s.find("\"dose\"") != std::string::npos) id(doser_a).turn_on();
            else if (s.find("\"stop\"") != std::string::npos) id(doser_a).turn_off();
    - topic: terra/${tenant}/${module}/doser-b-01/cmd
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("\"start\"") != std::string::npos || s.find("\"dose\"") != std::string::npos) id(doser_b).turn_on();
            else if (s.find("\"stop\"") != std::string::npos) id(doser_b).turn_off();
    - topic: terra/${tenant}/${module}/doser-ph-01/cmd
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("\"start\"") != std::string::npos || s.find("\"dose\"") != std::string::npos) id(doser_ph).turn_on();
            else if (s.find("\"stop\"") != std::string::npos) id(doser_ph).turn_off();
    # Fallback dev Fase 0: HA request/set con payload crudo ON/OFF
    - topic: terra/${tenant}/${module}/pump-recirc-01/request/set
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("ON") != std::string::npos) id(pump_recirc).turn_on();
            else if (s.find("OFF") != std::string::npos) id(pump_recirc).turn_off();
    - topic: terra/${tenant}/${module}/valve-fill-01/request/set
      qos: 1
      then:
        - lambda: |-
            std::string s = x;
            if (s.find("ON") != std::string::npos) id(valve_fill).turn_on();
            else if (s.find("OFF") != std::string::npos) id(valve_fill).turn_off();

