name: terraos

networks:
  terra:
    driver: bridge

volumes:
  timescale_data:
  mosquitto_data:
  grafana_data:
  minio_data:
  ha_config:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: terra-mosquitto
    restart: unless-stopped
    networks: [terra]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_data:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 2 | grep -q . || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  timescale:
    image: timescale/timescaledb-ha:pg17
    container_name: terra-timescale
    restart: unless-stopped
    networks: [terra]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terra} -d ${POSTGRES_DB:-terra}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  telegraf:
    image: telegraf:1.34
    container_name: terra-telegraf
    restart: unless-stopped
    networks: [terra]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      timescale:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.0
    container_name: terra-grafana
    restart: unless-stopped
    networks: [terra]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescale:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: terra-minio
    restart: unless-stopped
    networks: [terra]
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    networks: [terra]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb -p local/terra-media || true;
      echo 'bucket terra-media ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: terra-ha
    restart: unless-stopped
    networks: [terra]
    ports:
      - "8124:8123" # 8123 del host lo ocupa TerraSmart (app preexistente del usuario)
    volumes:
      - ha_config:/config
      - ./infra/homeassistant/configuration.yaml:/config/configuration.yaml:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  # LABORATORIO (ADR-0017) — monitor del simulador, NO del producto.
  # Observa física (:7751) + ctl (:7750) del host y el MQTT de laboratorio.
  # Dashboard: http://localhost:1880/dashboard · Editor: http://localhost:1880
  nodered:
    build: ./sim/nodered
    container_name: terra-nodered
    restart: unless-stopped
    networks: [terra]
    ports:
      - "1880:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway" # el sim corre en el host (pnpm dev)
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1880/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
